<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinical Genogram - Dev</title>
  <script type="module" src="/build/clinical-genogram.esm.js"></script>
  <script nomodule src="/build/clinical-genogram.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; font-family: sans-serif; }
    header { background: #1a237e; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 500; }
    .controls { display: flex; gap: 6px; }
    .controls button { padding: 5px 10px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: white; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .controls button:hover { background: rgba(255,255,255,0.2); }
    main { flex: 1; min-height: 0; overflow: hidden; }
    clinical-genogram { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>Clinical Genogram - Dev</h1>
    <div class="controls">
      <button onclick="loadSample('three-generation')">3 Gen Family</button>
      <button onclick="loadSample('clinical')">Clinical</button>
      <button onclick="loadSample('consanguinity')">Consanguinity</button>
      <button onclick="clearAll()">Clear</button>
    </div>
  </header>
  <main>
    <clinical-genogram id="genogram"></clinical-genogram>
  </main>
  <script>
    const el = document.getElementById('genogram');
    el.addEventListener('genogramChange', e => console.log('Change:', e.detail));
    el.addEventListener('nodeClick', e => console.log('Click:', e.detail));

    async function loadSample(name) {
      const map = {
        'three-generation': '/demo/sample-data/three-generation-family.json',
        'clinical': '/demo/sample-data/clinical-case-study.json',
        'consanguinity': '/demo/sample-data/consanguinity-family.json',
      };
      const data = await fetch(map[name]).then(r => r.json());
      el.setData(data);
    }

    function clearAll() {
      el.setData({ version: '1.0.0', persons: [], relationships: [] });
    }

    loadSample('three-generation');
  </script>
</body>
</html>
